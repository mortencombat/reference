# Example deployment. Copy config/site.example.yml to ./config/site.yml and
# put your own cheat sheets (Markdown) in ./data/posts.
services:
  reference:
    image: ghcr.io/mortencombat/reference:latest
    # build: .
    ports:
      - "8080:8080"
    volumes:
      # Mount the directories, not the files: editors save by replacing the
      # file, which a single-file bind mount does not follow.
      - ./config:/config:ro
      - ./data:/data:ro
      # Optional: keep built releases across container recreation so that
      # switching back to an earlier config is instant.
      # - reference-srv:/srv
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
# volumes:
#   reference-srv:
