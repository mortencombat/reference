# Theme configuration.
#
# Every key here can be overridden from the site config (or a mounted
# config file) under `theme_config:`. See config/site.example.yml.

# Limit on the number of recent articles
recent_posts_limits: 4

# The categories and order displayed on the home page
index_categories:
  - AI
  - Programming
  - Toolkit
  - Operating System
  - Linux Command
  - Python
  - Database
  - Keyboard Shortcuts
  - Game
  - Other

# Home recommended posts (slugs)
index_recommends:
  - chatgpt
  - bash
  - python
  - javascript
  - go
  - vim
  - regex
  - awk

# Posts shown as "Top" in the footer and sidebar (slugs, in order)
top_posts:
  - python
  - vim
  - javascript
  - bash
  - regex
  - sed
  - golang
  - html
  - java
  - postgres
  - vhdl

# Related posts on cheat sheet pages, chosen by tag and category overlap
related_posts:
  title: Related
  max_count: 4

top_posts_title: Top

# Home page hero
hero:
  title: Cheat Sheets
  tagline: for Developers
  subtitle: Quick references and cheat sheets, crafted by the open community, to boost your productivity.
  # Optional call-to-action buttons: [{ label: ..., url: ..., icon: github }]
  links: []

# Optional features. All off by default except the contribute section.
features:
  # Share menu in the header and footer (opens social networks on click)
  share: false
  # "Run code" buttons on sheets that support it; loads LiveCodes from a CDN
  livecodes: false
  # "See something missing?" section on the home page linking to upstream
  contribute: true

# Icon links in the header, next to the dark mode toggle. `icon` is the name
# of an SVG in source/assets/icon.
header:
  links:
    - label: Source on GitHub
      url: https://github.com/mortencombat/reference
      icon: github
    - label: About
      url: /about/
      icon: info

footer:
  # Credit the upstream project in the footer
  credit: true

# The project this site is built on. Used for credit and contribute links.
upstream:
  name: Reference
  author: Fechin
  repo: https://github.com/Fechin/reference
  donate: https://github.com/sponsors/Fechin

# Your own links, if any. Leave empty to omit the related metadata.
social:
  # X (Twitter) handle without the @
  twitter: ""
  # GitHub profile or repository URL
  github: ""
