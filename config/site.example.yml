# Site configuration for a self-hosted Reference instance.
#
# Mount this file at /config/site.yml in the container. Everything here is
# merged over the built-in Hexo configuration, so any Hexo setting can be
# overridden, but the keys below are the ones meant for operators. Remove
# keys you do not want to change; the defaults are shown.
#
# The container watches this file. Saving a change triggers a rebuild of the
# site in the background; the running site is replaced once the build
# succeeds.

# --- Site identity ----------------------------------------------------------

title: Reference
subtitle: Cheat Sheets for Developers
description: Quick reference and cheat sheets for developers
# Shown in the HTML author meta tag.
author: Reference

# Public URL of this instance, used for the sitemap, canonical links and
# social previews. Set it to the address your users type in.
url: http://localhost:8080
# Set both if the site is served under a sub-path, e.g. https://example.com/ref/
# url: https://example.com/ref
# root: /ref/

# --- Content ----------------------------------------------------------------

theme_config:
  # Categories shown on the home page, in this order. This list also decides
  # which cheat sheets exist on the site: a sheet is built only if at least
  # one of its categories admits it (or it is a featured post). Everything
  # else is left out, including from search and the sitemap. Remove "Game"
  # here and no game sheet is built. Your own sheets need one of these
  # categories too.
  #
  # An entry is either a name (the category as the sheets declare it) or an
  # object that adjusts it:
  #   include: [slugs]  additive, sheets from anywhere join this category
  #   except: [slugs]   subtractive
  #   only: [slugs]     exact membership, sheets from anywhere; cannot be
  #                     combined with include or except
  #   sort: date | -date | title | -title | listed
  #                     order within the section; listed needs an only list
  # A category of your own is just a new name with include or only, or
  # sheets under /data/posts that declare it. Examples:
  #   - name: Keyboard Shortcuts
  #     include: [windows-shortcuts]
  #     except: [apex-legends]
  #   - name: Team
  #     only: [bash, git, docker]
  #     sort: listed
  # A sheet is built if any category admits it. Its categories become the
  # ones configured here, so search and metadata agree with the home page.
  categories:
    - AI
    - Programming
    - Testing
    - Toolkit
    - Productivity
    - Operating System
    - Linux Command
    - Python
    - Database
    - Keyboard Shortcuts
    - Game
    - Other

  # Order of sheets within every section unless a category sets its own
  # sort: date (oldest first, as upstream), -date, title or -title.
  sort_posts: date

  # Cheat sheets to leave out of every category (slugs, the file name
  # without .md). For trimming a single category, use except above.
  exclude_posts: []
  #  - apex-legends
  #  - apple-music

  # Cheat sheets featured at the top of the home page (slugs). These are
  # always built, even if none of their categories is listed above.
  featured_posts:
    - chatgpt
    - bash
    - python
    - javascript
    - go
    - vim
    - regex
    - awk

  # --- Home page hero -------------------------------------------------------
  hero:
    # Headline. Each line is rendered on its own line, in the same typography.
    title: |-
      Cheat Sheets
      for Developers
    # Paragraph under the headline. Empty to omit.
    tagline: Quick references and cheat sheets to boost your productivity.
    # Optional buttons under the tagline. `icon` is the name of an SVG in
    # source/assets/icon (for example "github"); omit it for a text button.
    links: []
    #  - label: Our wiki
    #    url: https://wiki.example.com
    #  - label: Source
    #    url: https://github.com/example/reference
    #    icon: github

  # --- Optional features ----------------------------------------------------
  features:
    # Share menu in the header: Facebook, Reddit, Pinterest, LinkedIn, Line,
    # email and copy link. Nothing loads until an entry is clicked.
    share: false
    # "Run code" buttons on sheets that support them. Loads the LiveCodes
    # playground from a public CDN, so it does not work offline.
    livecodes: false
    # "See something missing?" section on the home page pointing to the
    # upstream project.
    contribute: true

  # --- Header ---------------------------------------------------------------
  # Icon links next to the dark mode toggle. `icon` is the name of an SVG in
  # source/assets/icon, themes/coo/icons or /data/icons; "github" and "info"
  # are built in.
  header:
    links:
      - label: Source on GitHub
        url: https://github.com/mortencombat/reference
        icon: github
      - label: About
        url: /about/
        icon: info

  # --- Footer ---------------------------------------------------------------
  footer:
    # Credit line naming the upstream project and its author. Please keep it.
    credit: true
