# nginx configuration for the Reference container. Runs unprivileged on 8080.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;
        # Symlink to the active release; swapped atomically on rebuild.
        root /srv/www;
        index index.html;

        # Healthy only while a release is actually being served. A tiny body,
        # never cached: probes run every few seconds.
        location = /healthz {
            access_log off;
            include /etc/nginx/reference-headers.conf;
            add_header Cache-Control "no-store";
            default_type text/plain;
            if (!-f $document_root/index.html) {
                return 503 "no release\n";
            }
            return 200 "ok\n";
        }

        # Which release is being served, written by the watcher on activation.
        location = /status.json {
            access_log off;
            include /etc/nginx/reference-headers.conf;
            add_header Cache-Control "no-store";
            alias /srv/state/status.json;
            default_type application/json;
        }

        # The build appends ?_v=<build> to these, so they can be cached for long.
        location ~* \.(css|js|png|jpe?g|woff2)$ {
            include /etc/nginx/reference-headers.conf;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # Other assets are referenced without a version; keep the cache short.
        location ~* \.(svg|ico|gif|webp|woff|ttf|json|xml|txt)$ {
            include /etc/nginx/reference-headers.conf;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # Pages must revalidate so a rebuild shows up immediately.
        location / {
            include /etc/nginx/reference-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
