# nginx configuration for the Reference container. Runs unprivileged on 8080.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;
        # Symlink to the active release; swapped atomically on rebuild.
        root /srv/www;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed asset URLs (?_v=...) change on every build, so cache them.
        location ~* \.(css|js|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # Pages must revalidate so a rebuild shows up immediately.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
